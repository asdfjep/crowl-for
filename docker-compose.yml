services:
  news-analyzer:
    build:
      context: .
      # 可传 PIP_INDEX_URL 覆盖 pip 源，默认使用清华源
      #   PIP_INDEX_URL=https://pypi.org/simple docker compose up -d --build
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    container_name: news-analyzer
    ports:
      - "8011:8011"
    environment:
      - NEWS_DATA_DIR=/app/data
      - NEWS_REPORT_DIR=/app/reports
      - NEWS_GENERATE_HTML_BRIEF=1
      # The configured relay (web 系统设置) serves a vLLM reasoning model:
      # with thinking enabled it burns the whole max_tokens budget on hidden
      # chain-of-thought and returns empty content, so every translation and
      # polish call came back blank. This flag sends
      # chat_template_kwargs.enable_thinking=false on LLM requests.
      - NEWS_LLM_NO_THINK=1
      # Crawler run.py --once just lands news_*.json into /app/data (shared
      # volume); the batch job does the analysis, so no ANALYZER_URL is set
      # (it would make the crawler wait on a full analyze call and time out).
      # Health check: fail-fast on unreachable sources instead of doubling the
      # timeout with a retry (a 60s-stuck source used to cost ~122s per run).
      - NEWS_HEALTH_RETRIES=0
      # The old unreachable sources (TheVerge/BOE/SpaceNews/AIBusiness/LGDisplay)
      # were replaced by reachable RSS feeds (sources/extra_feeds.py), so the
      # skip list stays empty. If an RSS feed turns out unreachable on this
      # network, add its key here or drop it from EXTRA_FEEDS.
      - NEWS_HEALTH_SKIP=
    volumes:
      # Named volumes: avoids bind-mounting host paths, which fails with
      # "read-only file system" when the Docker daemon cannot write to the
      # project directory (e.g. rootless docker on some mounts).
      - news-data:/app/data
      - news-reports:/app/reports
    restart: unless-stopped

volumes:
  news-data:
  news-reports: