services:
  news-analyzer:
    build:
      context: .
      # 可传 PIP_INDEX_URL 覆盖 pip 源，默认使用清华源
      #   PIP_INDEX_URL=https://pypi.org/simple docker compose up -d --build
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    container_name: news-analyzer
    ports:
      - "8011:8011"
    environment:
      - NEWS_DATA_DIR=/app/data
      - NEWS_REPORT_DIR=/app/reports
      - NEWS_GENERATE_HTML_BRIEF=1
    volumes:
      # persist uploaded data and generated reports on the host
      - ./data:/app/data
      - ./reports:/app/reports
    restart: unless-stopped