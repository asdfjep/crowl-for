services:
  news-analyzer:
    build:
      context: .
      # 可传 PIP_INDEX_URL 覆盖 pip 源，默认使用清华源
      #   PIP_INDEX_URL=https://pypi.org/simple docker compose up -d --build
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    container_name: news-analyzer
    ports:
      - "8011:8011"
    environment:
      - NEWS_DATA_DIR=/app/data
      - NEWS_REPORT_DIR=/app/reports
      - NEWS_GENERATE_HTML_BRIEF=1
      # Health check: fail-fast on unreachable sources instead of doubling the
      # timeout with a retry (a 60s-stuck source used to cost ~122s per run).
      - NEWS_HEALTH_RETRIES=0
      # Sources that are unreachable / anti-bot-blocked from this server's
      # network (verge=timeout, boe=500 URL, aibusiness=403, spacenews=Cloudflare,
      # lgdisplay=JS SPA). Remove them from the list to track again, e.g. on a
      # network with direct access.
      - NEWS_HEALTH_SKIP=conflict_events,boe,aibusiness,spacenews,lgdisplay
    volumes:
      # Named volumes: avoids bind-mounting host paths, which fails with
      # "read-only file system" when the Docker daemon cannot write to the
      # project directory (e.g. rootless docker on some mounts).
      - news-data:/app/data
      - news-reports:/app/reports
    restart: unless-stopped

volumes:
  news-data:
  news-reports: